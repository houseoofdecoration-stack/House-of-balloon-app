<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&amp;display=swap">
<style>
:root{--bg:#F2F6F3;--card:#fff;--ink:#0E2A1F;--mute:#5B7468;--line:#DCE6DF;--pri:#0F5A3F;--onpri:#fff;--acc:#E8574A;--soft:#E3EFE8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0A261C;--card:#113627;--ink:#EDF6F0;--mute:#9DB8A9;--line:#1E4A38;--pri:#2FA36F;--onpri:#052015;--soft:#17432F}}
:root[data-theme="dark"]{--bg:#0A261C;--card:#113627;--ink:#EDF6F0;--mute:#9DB8A9;--line:#1E4A38;--pri:#2FA36F;--onpri:#052015;--soft:#17432F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque","Noto Sans Devanagari",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:28px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;margin:22px 0 8px}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--pri);color:var(--onpri);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;opacity:.85}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button,select,input{font:inherit;color:inherit}
.act{background:var(--soft);border:0;border-radius:12px;padding:12px 4px;font-size:13px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.row{display:flex;align-items:center;gap:10px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:14px}
.grow{flex:1;min-width:0}
.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;text-decoration:none;color:var(--ink);cursor:pointer;font-size:13px}
.ib.call{background:var(--pri);color:var(--onpri)}
select{background:var(--soft);border:0;border-radius:10px;padding:6px 8px;font-size:13px;max-width:100%}
.tag{font-size:12px;color:var(--mute)}
.od{color:var(--acc);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;padding:10px 0;font-size:12px;color:var(--mute);cursor:pointer;border-radius:10px}
nav button.on{color:var(--pri);font-weight:800;background:var(--soft)}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.day{flex:none;width:52px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0;cursor:pointer}
.day.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.day b{display:block;font-size:18px}.day span{font-size:11px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pad button{height:58px;font-size:22px;border:0;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.num{font-size:30px;text-align:center;min-height:44px;font-weight:600;letter-spacing:.04em}
.big{display:block;text-align:center;background:var(--pri);color:var(--onpri);border-radius:16px;padding:14px;margin-top:12px;text-decoration:none;font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,.sheet select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.save{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font-weight:600;cursor:pointer}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;margin:6px 0;background:var(--card);border:1px solid var(--line)}
.msg.me{margin-left:auto;background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.msg small{display:block;font-size:11px;opacity:.7}
.mc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;cursor:pointer}
.mc b{display:block}.mn{text-align:right}.mn b{font-size:24px;font-weight:800;line-height:1}.mn span{font-size:13px;color:var(--pri);font-weight:600}
.dash{width:100%;margin:10px 0;padding:16px;border:2px dashed var(--line);border-radius:16px;background:none;color:var(--ink);cursor:pointer;text-align:center}

html[data-theme="royal"]{--bg:#F3F7F4;--card:#FFFFFF;--ink:#0B1F17;--mute:#5E7268;--line:rgba(15,90,63,.10);--soft:#EAF3EE;--pri:#0F5A3F;--onpri:#FFFFFF;--acc:#F43F5E;--g1:linear-gradient(135deg,#0F5A3F 0%,#14946B 100%);--g2:linear-gradient(135deg,#F59E0B 0%,#EA580C 100%);--sh:0 1px 2px rgba(11,31,23,.05),0 10px 28px -10px rgba(15,90,63,.22);--glass:rgba(255,255,255,.72);--bme:linear-gradient(135deg,#0F5A3F 0%,#168A62 100%);--bthem:#FFFFFF;--wall:#ECF3EE}

html[data-theme="royal"] .brand{position:sticky;top:0;z-index:4;margin:-14px -16px 10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
html[data-theme="royal"] .brand b{font-size:18px;font-weight:800;background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme="royal"] .brand span{background:var(--soft);border:0;font-weight:700;color:var(--pri);padding:2px 8px}
html[data-theme="royal"] .lg{border-radius:14px;box-shadow:0 6px 16px -6px rgba(15,90,63,.45);background:#fff}
html[data-theme="royal"] h1{letter-spacing:-.03em}
/* chips & pills */
html[data-theme="royal"] .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .12s}

html[data-theme="royal"] .sp.on{box-shadow:0 8px 18px -8px var(--c)}
/* home */
html[data-theme="royal"] .tbk{border-radius:18px;background:var(--g1);box-shadow:0 12px 24px -12px rgba(15,90,63,.7);padding:12px 14px}

html[data-theme="royal"] .mc{position:relative;overflow:hidden;border:0;border-radius:20px;background:var(--card);box-shadow:var(--sh);padding:16px 16px 16px 22px;margin:10px 0;transition:transform .12s}

html[data-theme="royal"] .lbr{flex-wrap:wrap;gap:8px}html[data-theme="royal"] .lbr select{flex:1 1 100%}html[data-theme="royal"] .lbr .fb{flex:1;justify-content:center;height:42px}html[data-theme="royal"] .lbr .cb.ic{width:46px;padding:0;justify-content:center}

const APP_V="v18.6";
const BRAND=`<div class="brand"><img class="lg" src="${LOGO}" width="34" height="34" alt="House of Balloons"><b>House of Balloons</b><span>CRM</span><button class="ib mnu" data-a="menu" aria-label="Menu: download and backup">⋮</button></div>`;
async function saveFile(name,data,type){
  try{if(window.claude&&claude.use){const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return}}}catch(e){if(e&&e.code==="declined")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){}}
function appHtml(){const c=document.documentElement.cloneNode(true);const ap=c.querySelector("#app");if(ap)ap.innerHTML="";c.querySelectorAll(".sheet,.mtoast").forEach(x=>x.remove());return "<!doctype html>\n"+c.outerHTML}
function leadsCsv(){const q=x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"',H=["Name","Phone","Location","Venue","Pipeline","Stage","Value","Event date","Notes"];
  return "\ufeff"+[H.map(q).join(",")].concat(S.leads.map(l=>[l.name,l.phone,l.loc,l.venue,l.pipe,l.stage,l.value,l.evS?new Date(l.evS).toLocaleDateString():"",(l.notes||[]).map(n=>n.t).join(" | ")].map(q).join(","))).join("\n")}
function toastMsg(l,t){try{const o=document.querySelector(".mtoast");if(o)o.remove();const d=document.createElement("div");d.className="mtoast";d.setAttribute("data-a","open");d.setAttribute("data-id",l.id);d.innerHTML=`<img src="${LOGO}" width="28" height="28" alt=""><span><b>${esc(l.name)}</b><br>${esc(String(t).slice(0,60))}</span><i>${l.unread||1}</i>`;document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}catch(e){}}
function openNotes(id){const l=leadOf(id);if(!l)return;const o=document.querySelector("#nsh");if(o)o.remove();const N=l.notes||[];
  sheet(`<h2 style="margin-top:0">🔒 Private notes · ${esc(l.name)}</h2><textarea id="nnew" rows="2" placeholder="Add a new private note…"></textarea><button class="save" data-a="nadd" data-id="${id}">Add note</button>`+(N.length?"":`<div class="mute" style="margin-top:10px">No notes yet.</div>`)+N.map((x,i)=>[x,i]).reverse().map(([x,i])=>`<div class="nrow"><div class="tag">${dshort(x.ts)} · ${tm(x.ts)}</div><textarea id="ne${i}" rows="2">${esc(x.t)}</textarea><div class="row" style="gap:8px"><button class="save" data-a="nsave" data-id="${id}" data-i="${i}">Save</button><button class="save dl" data-a="ndel" data-id="${id}" data-i="${i}">Delete</button></div></div>`).join(""),"nsh")}
function photoSet(l,f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{try{const z=128,c=document.createElement("canvas");c.width=c.height=z;const w=im.width,h=im.height,m=Math.min(w,h);c.getContext("2d").drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,z,z);l.photo=c.toDataURL("image/jpeg",.78);save()}catch(e){}};im.src=r.result};r.readAsDataURL(f)}
const inr=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
