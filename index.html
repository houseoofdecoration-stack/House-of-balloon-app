<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F2F6F3;--card:#fff;--ink:#0E2A1F;--mute:#5B7468;--line:#DCE6DF;--pri:#0F5A3F;--onpri:#fff;--acc:#E8574A;--soft:#E3EFE8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A261C;--card:#113627;--ink:#EDF6F0;--mute:#9DB8A9;--line:#1E4A38;--pri:#2FA36F;--onpri:#052015;--soft:#17432F}}
:root[data-theme="dark"]{--bg:#0A261C;--card:#113627;--ink:#EDF6F0;--mute:#9DB8A9;--line:#1E4A38;--pri:#2FA36F;--onpri:#052015;--soft:#17432F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque","Noto Sans Devanagari",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:28px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;margin:22px 0 8px}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--pri);color:var(--onpri);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;opacity:.85}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button,select,input{font:inherit;color:inherit}
.act{background:var(--soft);border:0;border-radius:12px;padding:12px 4px;font-size:13px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.row{display:flex;align-items:center;gap:10px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:14px}
.grow{flex:1;min-width:0}
.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;text-decoration:none;color:var(--ink);cursor:pointer;font-size:13px}
.ib.call{background:var(--pri);color:var(--onpri)}
select{background:var(--soft);border:0;border-radius:10px;padding:6px 8px;font-size:13px;max-width:100%}
.tag{font-size:12px;color:var(--mute)}
.od{color:var(--acc);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;padding:10px 0;font-size:12px;color:var(--mute);cursor:pointer;border-radius:10px}
nav button.on{color:var(--pri);font-weight:800;background:var(--soft)}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.day{flex:none;width:52px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0;cursor:pointer}
.day.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.day b{display:block;font-size:18px}.day span{font-size:11px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pad button{height:58px;font-size:22px;border:0;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.num{font-size:30px;text-align:center;min-height:44px;font-weight:600;letter-spacing:.04em}
.big{display:block;text-align:center;background:var(--pri);color:var(--onpri);border-radius:16px;padding:14px;margin-top:12px;text-decoration:none;font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,.sheet select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.save{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font-weight:600;cursor:pointer}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;margin:6px 0;background:var(--card);border:1px solid var(--line)}
.msg.me{margin-left:auto;background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.msg small{display:block;font-size:11px;opacity:.7}
.mc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;cursor:pointer}
.mc b{display:block}.mn{text-align:right}.mn b{font-size:24px;font-weight:800;line-height:1}.mn span{font-size:13px;color:var(--pri);font-weight:600}
.dash{width:100%;margin:10px 0;padding:16px;border:2px dashed var(--line);border-radius:16px;background:none;color:var(--ink);cursor:pointer;text-align:center}

.thw .sp.on{background:var(--pri)!important;color:var(--onpri)!important;border-color:var(--pri)!important}
.thw .sp.on i{background:var(--onpri)!important}
.thw>.row .grow b{font-size:16px!important;line-height:1.15}
.thw>.row .tag{font-size:11.5px!important}
.thw>.row .ib{width:36px!important;height:36px!important}
.thw .msgs{padding:4px 0}
/* v14: logo + customer photo */
.lg{display:block;margin:0 auto;object-fit:contain}
label.rb{display:grid;place-items:center;margin:0;cursor:pointer}
.attw{position:relative;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.attw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
.msg.me .alb{margin-left:auto}
.alb{gap:2px;border-radius:14px;overflow:hidden}.alb .ac{border-radius:0}.alb.many{width:min(270px,100%)}
/* v15: tap feedback only on the pressed control */
*{-webkit-tap-highlight-color:transparent}
.lr:focus,.lr:focus-visible,.lr:focus-within{outline:none}
button:active,a.cb:active,a.ib:active,.ib:active,.chip:active,.sp:active,.fb:active,.tr:active{transform:scale(.93);filter:brightness(.9)}
/* v15: stage pipeline (only the pressed stage is highlighted) */
.thw .sp{position:relative;background:var(--card);color:var(--ink)}
.thw .sp+.sp::before{content:"";position:absolute;left:-7px;top:50%;width:7px;height:2px;background:var(--line)}
.thw .sp:focus,.thw .sp:hover{outline:none;background:var(--card);color:var(--ink)}
.thw .sp.on,.thw .sp.on:focus,.thw .sp.on:hover{background:var(--pri)!important;color:var(--onpri)!important;border-color:var(--pri)!important;font-weight:700;box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
/* v15: private note pinned above the typing bar */
.npin{display:flex;align-items:center;gap:6px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:14px;padding:4px 6px 4px 10px;margin-bottom:4px;color:#78350F;font-size:13px}
.npt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.npb2{flex:none;border:0;background:#fff;color:#78350F;border-radius:12px;padding:5px 9px;font-size:13px;font-weight:600;cursor:pointer}
.npa.x{background:#9CA3AF}
.nrow{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.save.dl{background:var(--acc)}
/* v15: sheet back button */
.sbk{border:0;background:var(--soft);color:var(--ink);border-radius:18px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;margin:0 0 10px;display:inline-flex}
/* v15: unread bubble */
.lavw{position:relative;width:40px;margin:0 auto}.lavw .lav{margin:0 0 3px}
.ubb{position:absolute;top:-7px;right:-10px;min-width:20px;height:20px;border-radius:10px;background:#EF4444;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.lr.unr{box-shadow:inset 3px 0 0 #EF4444}.lr.unr .ln{font-weight:800}
.bd{background:#EF4444}
.mtoast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:92%;z-index:9;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.25);border-radius:18px;padding:8px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13px}
.mtoast i{font-style:normal;background:#EF4444;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700}
/* v15: brand bar */
.hav{position:relative}.hav input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;padding:0;border:0;cursor:pointer}
.hav.nop::after{content:"📷";position:absolute;right:-2px;bottom:-2px;font-size:10px;background:#fff;border-radius:8px;padding:0 2px;line-height:1.3}
.mrow{display:flex;align-items:flex-end;gap:6px;max-width:92%}.mrow .msg{margin:2px 0!important}
.mav{flex:none;width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-size:11px;font-weight:600}.mav img{width:100%;height:100%;object-fit:cover;display:block}
.mnu{margin-left:auto;font-size:22px;font-weight:700;width:38px;height:38px}.row>.mnu{margin-left:6px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 0 8px}.brand b{font-size:17px}.brand span{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:0 7px}
/* v14: chat messages as plain text, no bubble box */
.msgs .msg,.msgs .msg.me,:root .msgs .msg,:root[data-theme="neon"] .msgs .msg{background:none!important;border:0!important;border-radius:0!important;padding:0!important;margin:5px 0!important;color:var(--ink)!important;max-width:88%}
.msgs .msg.me{margin-left:auto!important;text-align:right}
.msgs .msg small{margin-top:1px;opacity:.55}
.row>.lg{margin:0;flex:none}
.lav,.av{overflow:hidden}.lav img,.av img,.hav img{width:100%;height:100%;object-fit:cover;display:block}
.hav{flex:none;width:38px;height:38px;border-radius:12px;border:0;padding:0;overflow:hidden;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-weight:600;font-size:15px;cursor:pointer}
/* v14: typing bar + private note flush with screen bottom, note edit button */
#app.tw{padding-bottom:0}
.thw{min-height:calc(100vh - 16px);min-height:calc(100dvh - 16px - env(safe-area-inset-top,0px))}
.dock{padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px))}
.dock .np{margin-bottom:4px}
.note.nt{align-items:center}
.note.nt .ned{flex:none;border:0;background:none;font-size:14px;padding:0 2px;cursor:pointer;line-height:1}
.stk{flex:none;display:flex;flex-direction:column;gap:4px}
.stk .fb{height:25px;font-size:11.5px;padding:0 9px;gap:4px;justify-content:center;margin:0}
.stk .fb svg{width:12px;height:12px}
.ld{padding:5px 8px;margin-top:6px}
</style>

  const O=[...P.filter(x=>isM(x.a)),...P.filter(x=>!isM(x.a))];
