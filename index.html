<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>House of Balloons CRM</title>
  <meta name="application-name" content="House of Balloons CRM">
  <meta name="apple-mobile-web-app-title" content="House of Balloons">
  <meta name="theme-color" content="#0F5A3F">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:site_name" content="House of Balloons">
  <meta property="og:title" content="House of Balloons CRM">
  <meta property="og:description" content="House of Balloons: leads, chats and bookings in one place.">
  <meta property="og:image" content="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAMAAABrrFhUAAABgFBMVEX///////7//v7+///+//79///+/v/+/v79/v7+/v3//f3+/f7+/f39/f79/f3+/fz9/fz9/fv8///8/f38/fz9/fz9/f7+/f38/f3+/v7+/v7+/f3+/...">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="House of Balloons CRM">
  <meta name="twitter:image" content="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAMAAABrrFhUAAABgFBMVEX///////7//v7+///+//79///+/v/+/v79/v7+/v3//f3+/f7+/f39/f79/f3+/fz9/fz9/fv8///8/f38/fz9/fz9/f7+/f38/f3+/v7+/v7+/f3+/...">
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAMAAAAKE/YAAAABgFBMVEX///////7//v7+///+//79///9//7+/v79/v7+/f39/f79/f3+/fz9/vz9/fz9/fr7/v3+/P39/P39/Pz9/Pr9+/z9+vv9+vX...">
  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAMAAAAKE/YAAAABgFBMVEX///////7//v7+///+//79///9//7+/v79/v7+/f39/f79/f3+/fz9/vz9/fz9/fr7/v3+/P39/P39/Pz9/Pr...">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
  <style>
    :root{
      --bg:#F2F6F3;--card:#fff;--ink:#0E2A1F;--mute:#5B7468;--line:#DCE6DF;--pri:#0F5A3F;--onpri:#fff;--acc:#E8574A;--soft:#E3EFE8;
      box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
    }
    @media(prefers-color-scheme:dark){
      :root:not([data-theme="light"]){--bg:#0A261C;--card:#113627;--ink:#EDF6F0;--mute:#9DB8A9;--line:#1E4A38;--pri:#2FA36F;--onpri:#052015;--soft:#17432F}
    }
    :root[data-theme="dark"]{--bg:#0A261C;--card:#113627;--ink:#EDF6F0;--mute:#9DB8A9;--line:#1E4A38;--pri:#2FA36F;--onpri:#052015;--soft:#17432F}
    html{scroll-padding-top:env(safe-area-inset-top,0px)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque","Noto Sans Devanagari",system-ui,sans-serif}
    #app{max-width:520px;margin:0 auto;padding:16px 16px 110px}
    h1{font-size:28px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
    h2{font-size:17px;font-weight:600;margin:22px 0 8px}
    .mute{color:var(--mute);font-size:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
    .stat{background:var(--pri);color:var(--onpri);border-radius:14px;padding:12px}
    .stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
    .stat span{font-size:12px;opacity:.85}
    .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    button,select,input,textarea{font:inherit;color:inherit}
    .act{background:var(--soft);border:0;border-radius:12px;padding:12px 4px;font-size:13px;cursor:pointer}
    .chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
    .chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
    .chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
    .row{display:flex;align-items:center;gap:10px}
    .av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:14px}
    .grow{flex:1;min-width:0}
    .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ib{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;text-decoration:none;color:var(--ink);cursor:pointer;font-size:13px}
    .ib.call{background:var(--pri);color:var(--onpri)}
    select{background:var(--soft);border:0;border-radius:10px;padding:6px 8px;font-size:13px;max-width:100%}
    .tag{font-size:12px;color:var(--mute)}
    .od{color:var(--acc);font-weight:600}
    .fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:28px;cursor:pointer}
    nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));}
    nav button{border:0;background:none;padding:10px 0;font-size:12px;color:var(--mute);cursor:pointer;border-radius:10px}
    nav button.on{color:var(--pri);font-weight:800;background:var(--soft)}
    .days{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
    .day{flex:none;width:52px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0;cursor:pointer}
    .day.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
    .day b{display:block;font-size:18px}.day span{font-size:11px}
    .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
    .pad button{height:58px;font-size:22px;border:0;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
    .num{font-size:30px;text-align:center;min-height:44px;font-weight:600;letter-spacing:.04em}
    .big{display:block;text-align:center;background:var(--pri);color:var(--onpri);border-radius:16px;padding:14px;margin-top:12px;text-decoration:none;font-weight:600}
    .sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
    .sheet>div{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
    label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
    input,.sheet select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
    .save{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font-weight:600;cursor:pointer}
    .msg{max-width:82%;padding:8px 12px;border-radius:14px;margin:6px 0;background:var(--card);border:1px solid var(--line)}
    .msg.me{margin-left:auto;background:var(--pri);color:var(--onpri);border-color:var(--pri)}
    .msg small{display:block;font-size:11px;opacity:.7}
    .mc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;cursor:pointer}
    .mc b{display:block}.mn{text-align:right}.mn b{font-size:24px;font-weight:800;line-height:1}.mn span{font-size:13px;color:var(--pri);font-weight:600}
    .dash{width:100%;margin:10px 0;padding:16px;border:2px dashed var(--line);border-radius:16px;background:none;color:var(--ink);cursor:pointer;text-align:center}
    .note{background:#FFFBEB;border:1px solid #FDE68A;color:#78350F;border-radius:6px;padding:8px;font-size:12px;margin:10px 0 6px}
    .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#15803D;background:#DCFCE7;border-radius:20px;padding:3px 9px;white-space:nowrap}
    .pulse{width:8px;height:8px;border-radius:50%;background:#22C55E;animation:pl 1.2s infinite}
    @keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
    @media(prefers-reduced-motion:reduce){.pulse{animation:none}}
    .wrap{flex-wrap:wrap}.msgln{font-size:14px;margin:6px 0}
    nav button{position:relative}.bd{position:absolute;top:2px;margin-left:2px;background:var(--acc);color:#fff;border-radius:10px;font-size:10px;padding:0 5px}.bd:empty{display:none}
    .tap{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:8px;padding:8px 10px;cursor:pointer}
    .tap>span:first-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .brow{display:flex;align-items:center;gap:6px;margin-top:10px}
    .brow select{flex:1 1 0;min-width:0;padding:8px 6px;border-radius:18px;font-size:13px;text-overflow:ellipsis}
    .brow select.pl{background:var(--card);border:1px solid var(--line)}
    .cb{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--pri);color:var(--onpri);display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:700}
    .lr{display:flex;gap:12px;padding:14px 4px 14px 12px;border-left:4px solid var(--c);border-bottom:1px solid var(--line);cursor:pointer}
    .lc{flex:none;width:76px;text-align:center;font-size:13px;color:var(--mute)}
    .lav{width:56px;height:56px;border-radius:16px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-size:22px;font-weight:600;margin:0 auto 6px}
    .tdy{display:inline-flex;align-items:center;gap:5px;background:#DCFCE7;color:#15803D;font-weight:600;font-size:12px;border-radius:12px;padding:2px 8px}.tdy.old{background:var(--soft);color:var(--mute)}
    .lm{flex:1;min-width:0}.ln{font-size:20px;font-weight:800;line-height:1.2}
    .lp{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px;margin-top:2px}
    .lmsg{font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lbr{display:flex;gap:8px;margin-top:8px}
    .lbr select{flex:1;min-width:0;border-radius:22px;padding:11px 14px;font-size:16px;font-weight:700}
    .lbr .cb{height:44px;padding:0 18px;border-radius:22px;font-size:15px}
    .note.empty{background:var(--soft);border-color:var(--line);color:var(--mute)}
    .ub{display:inline-block;min-width:20px;text-align:center;background:#16A34A;color:#fff;border-radius:10px;font-size:11px;font-weight:600;padding:1px 6px}
    .newb{flex:none;background:var(--pri);color:var(--onpri);font-weight:600;padding:14px 16px;border-radius:14px;border:0;cursor:pointer}
    .chip.big{font-size:15px;padding:9px 16px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.cn{opacity:.7;margin-left:3px}
    .sp{flex:none;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--c);background:var(--card);color:var(--ink);border-radius:24px;padding:9px 16px;font-size:15px;cursor:pointer}
    .sp i{width:10px;height:10px;border-radius:50%;background:var(--c)}.sp.on{background:var(--c);color:#fff}.sp.on i{background:#fff}
    #app.tw{padding-bottom:12px}
    .thw{display:flex;flex-direction:column;min-height:calc(100vh - 32px);min-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
    .msgs{padding:10px 0}.msg{border-radius:20px;padding:12px 16px}.note.nt{display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-size:15px}.note.nt.ed{outline:2px solid #D97706}
    .dock{position:sticky;bottom:0;background:var(--bg);padding:6px 0}
    .np{display:grid;grid-template-columns:1fr 104px;gap:6px 8px;background:#FFFBEB;border:1.5px solid #FDE68A;border-radius:18px;padding:10px 12px;margin-bottom:8px}
    .npl{font-size:13px;font-weight:700;color:#92400E}.npb{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:8px}
    .np textarea{width:100%;padding:10px;border:1px solid #FDE68A;border-radius:12px;background:#fff;color:#0E2A1F;font:inherit;resize:none}
    .nb{border:0;border-radius:14px;padding:12px 6px;font-weight:700;cursor:pointer}.nb.pr{background:#0F5A3F;color:#fff}.nb.am{background:#FDE68A;color:#78350F}
    .rb{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);font-size:18px;cursor:pointer;color:var(--ink)}.rb.go{background:var(--pri);color:var(--onpri)}
    input.pillin{flex:1;min-width:0;width:auto;border-radius:24px;padding:11px 14px}
    :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
    .alb{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;width:230px;max-width:100%}.alb.one{grid-template-columns:1fr}
    .ac{position:relative;aspect-ratio:1;overflow:hidden;border-radius:12px;cursor:pointer;background:var(--soft)}.alb.one .ac{aspect-ratio:4/3}
    .ac img,.ac video{width:100%;height:100%;object-fit:cover;display:block}
    .more,.pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff}.more{background:rgba(0,0,0,.55);font-size:26px;font-weight:600}.pl{font-size:28px;text-shadow:0 1px 6px #000}
    .sheet textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;color:inherit}
    .np{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 12px;border-radius:22px;border-width:1px;margin-bottom:6px}
    .np textarea{flex:1;min-width:0;width:auto;min-height:32px;max-height:96px;padding:6px 2px;border:0;background:transparent;border-radius:0;field-sizing:content}
    .npl{font-size:15px}.npa{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:#0F5A3F;color:#fff;display:grid;place-items:center;cursor:pointer}
    .thw>.msgs{flex:1 1 auto;min-height:0}
    .alb.many{grid-template-columns:repeat(3,1fr);width:260px}
    .fsv{position:fixed;inset:0;z-index:9;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    .fsv .top{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff}.fsv .top .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fsv .ib{background:#222;color:#fff;border:1px solid #444}
    .vw{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
    .vs{flex:0 0 100%;min-width:0;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:0 4px}
    .vs img,.vs video{max-width:100%;max-height:100%;object-fit:contain}.vs object{width:100%;height:100%}
    :root[data-theme="neon"]{color-scheme:dark;--bg:#020305;--card:#090D12;--ink:#fff;--mute:#B8C4D0;--line:#2A4B5C;--pri:#00FFA3;--onpri:#00100A;--acc:#FF4FA3;--soft:#101A24}
    :root[data-theme="neon"] body{font-weight:500;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    :root[data-theme="neon"] .card,:root[data-theme="neon"] .mc,:root[data-theme="neon"] .dash{border:1px solid var(--line);padding:10px;margin:7px 0;border-radius:8px}
    :root[data-theme="neon"] .chip,:root[data-theme="neon"] .day,:root[data-theme="neon"] .sp,:root[data-theme="neon"] .act,:root[data-theme="neon"] .pad button,:root[data-theme="neon"] .tap,:root[data-theme="neon"] .sheet>div{border:1px solid var(--line)}
    :root[data-theme="neon"] input,:root[data-theme="neon"] select,:root[data-theme="neon"] textarea{background:#000;color:#fff;font-weight:600}
    :root[data-theme="neon"] input::placeholder,:root[data-theme="neon"] textarea::placeholder{color:#93A4B4;opacity:1}
    :root[data-theme="neon"] .chip.on,:root[data-theme="neon"] .day.on,:root[data-theme="neon"] .ib.call,:root[data-theme="neon"] .rb.go{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
    :root[data-theme="neon"] .save,:root[data-theme="neon"] .newb,:root[data-theme="neon"] .cb,:root[data-theme="neon"] .big{background:var(--pri);color:var(--onpri);font-weight:800}
    :root[data-theme="neon"] .msg{border-radius:10px;padding:8px 12px}
    :root[data-theme="neon"] nav{background:#000;border-top:2px solid #00F0FF}
    :root[data-theme="neon"] nav button.on{background:#00F0FF;color:#000;font-weight:800}
    :root[data-theme="neon"] .lr{padding:10px 4px 10px 10px;border-left-width:4px}
    :root[data-theme="neon"] .note,:root[data-theme="neon"] .np{background:#120E00;border:1px solid #FFB800;color:#FFD54A;border-radius:8px}
    :root[data-theme="neon"] .note.empty{background:var(--soft);border-color:var(--line);color:var(--mute)}
    :root[data-theme="neon"] .np textarea{color:#fff;background:transparent;border:0}
    :root[data-theme="neon"] .npl{color:#FFB800}
    :root[data-theme="neon"] .npa{background:#FFB800;color:#000;border-radius:8px}
    :root[data-theme="neon"] .tdy,:root[data-theme="neon"] .live,:root[data-theme="neon"] .ub{background:#00FFA3;color:#000;font-weight:800}
    :root[data-theme="neon"] .tdy.old{background:var(--soft);color:var(--mute)}
    :root[data-theme="neon"] .bd,:root[data-theme="neon"] .fab{color:#000}
    :root[data-theme="neon"] .fab{box-shadow:none;border:2px solid #fff;border-radius:12px}
    :root[data-theme="neon"] .sheet{background:rgba(0,0,0,.85)}
    :root[data-theme="neon"] .sheet>div{border-top:2px solid #00F0FF;border-radius:12px 12px 0 0}
    :root[data-theme="neon"] #app{padding:10px 10px 100px}
    :root[data-theme="neon"] h1{font-size:24px}
    :root[data-theme="neon"] :focus-visible{outline:2px solid #00F0FF;outline-offset:1px}
  </style>

  <script>
    window.MAKE_WEBHOOK_URL = "https://hook.eu1.make.com/2rtvh6gq8jq5jx05bv7lt9h2habjbvk1";
  </script>
</head>
<body>
  <div id="app">
    <h1>House of Balloons CRM</h1>

    <div class="card">
      <div class="mute">Leads</div>
      <div id="leadList"></div>
    </div>

    <div id="whatsappChatPanel" style="display:none; margin-top:20px;">
      <div class="card">
        <h3>WhatsApp Chat</h3>
        <div id="whatsappThread" style="max-height:300px; overflow-y:auto; padding:10px; background:#f5f5f5; border-radius:12px;"></div>
        <div style="margin-top:12px; display:flex; gap:8px;">
          <textarea id="whatsappReplyInput" rows="3" style="flex:1; border:1px solid #ccc; border-radius:8px; padding:8px;"></textarea>
          <button id="sendReplyBtn" style="padding:10px 14px; border:0; border-radius:8px; background:#0F5A3F; color:white;">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
